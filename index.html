<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Forca</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🎯 Jogo da Forca</h1>

    <div id="palavra" class="palavra"></div>

    <h3>Letras Erradas</h3>

    <div id="erradas" class="erradas"></div>

    <h3>Tentativas Restantes</h3>

    <div id="tentativas"></div>

    <input
        type="text"
        id="letra"
        maxlength="1"
        placeholder="Digite uma letra">

    <br>

    <button id="btn">Tentar</button>

    <button id="novo">Novo Jogo</button>

    <h2 id="mensagem"></h2>

</div>

<script src="script.js"></script>

</body>
</html>
